name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and production Mixin smoke (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew build compileIntegrationJava productionMixinSmoke --no-daemon
      - name: Build and production Mixin smoke (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build compileIntegrationJava productionMixinSmoke --no-daemon
